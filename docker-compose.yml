name: hermes-team

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: [.env]
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${DASHBOARD_SECRET}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - HERMES_API_TIMEOUT=1800
      - HERMES_STREAM_READ_TIMEOUT=1800
    ports:
      - "127.0.0.1:9119:9119"   # dashboard (localhost only)
      - "127.0.0.1:8642:8642"   # OpenAI-compatible API (localhost only)
    volumes:
      - ./data:/opt/data          # config, memory, profiles, skills
      - ./shared:/opt/data/shared # team notes + inboxes (visible on host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1g
    depends_on: [searxng]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
